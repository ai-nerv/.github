name: family

on:
  push:
    branches: [develop, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Every step is a phase of scripts/ci.sh, which is where what CI does is written down.
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Pinned recipe runner
        run: scripts/ci.sh runner
      - name: Required containment backend
        run: scripts/ci.sh backend
      - name: Verify the pinned family
        run: scripts/ci.sh verify
      - name: Verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: family-verification
          path: target/family/
          if-no-files-found: warn
