name: family

on:
  push:
    branches: [develop, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Pinned recipe runner
        run: |
          # v0.7.2: the first release that builds anywhere but its author's machine.
          nix build github:termworks/oslo/86d9ded3cc0929fe57ce1d27dc0de30e3b8488b4 --out-link "$RUNNER_TEMP/oslo"
          echo "$RUNNER_TEMP/oslo/bin" >> "$GITHUB_PATH"
      - name: Required containment backend
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap
          # This image forbids the unprivileged user namespaces the jail is made of; a developer's
          # machine does not, and the jail is what is under test, not the image's policy.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --ro-bind / / true
      - name: Verify the pinned family
        run: nix develop ./magi --command oslo make verify
      - name: Verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: family-verification
          path: target/family/
          if-no-files-found: warn
